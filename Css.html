<!DOCTYPE html>
<html lang="en">
<head>
    <title>FontStyle</title>
<style>
    .circle-image {
        width: 200px;
        height: 200px;
        border-radius: 50%;
        object-fit: cover;
    }
</style>
</head>
<body>
    <p style="color:red;font-size:23px;font-family:Verdana;background-color:black">The text here is not blue color. It is red</p>
    <img class="circle-image" src="fishy.jpg" alt="Fish" >
    <p>End</p>

</body>
</html>
